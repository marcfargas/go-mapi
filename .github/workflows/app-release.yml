name: Build signed standalone App

on:
  workflow_call:
    inputs:
      version: { type: string, required: true }
      track: { type: string, required: true }

permissions:
  contents: read
  id-token: write

jobs:
  build-sign-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: artifact-signing
    env:
      GOMAPI_OAUTH_CLIENT_ID: ${{ secrets.GOMAPI_OAUTH_CLIENT_ID }}
      GOMAPI_OAUTH_CLIENT_SECRET: ${{ secrets.GOMAPI_OAUTH_CLIENT_SECRET }}
      GOMAPI_ADMIN_RELEASE_METADATA_URL: ${{ vars.ADMIN_RELEASE_METADATA_URL }}
      GOMAPI_STORE_PACKAGE_FAMILY_NAME: ${{ vars.STORE_PACKAGE_FAMILY_NAME }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: extractions/setup-just@v2
      - name: Require production signing inputs
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          if ($env:ACT) { throw 'Production signing requires hosted infrastructure' }
          if ($env:SIGNING_ENDPOINT -cne 'https://weu.codesigning.azure.net/' -or $env:SIGNING_ACCOUNT -cne 'lachispa' -or $env:SIGNING_PROFILE -cne 'lachispa') { throw 'Production signing profile required' }
          foreach ($name in @('GOMAPI_OAUTH_CLIENT_ID','GOMAPI_OAUTH_CLIENT_SECRET')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing protected release input: $name" }
          }
          if ((Get-Content src/app/VERSION -Raw).Trim() -cne '${{ inputs.version }}') { throw 'App source VERSION differs from release' }
      - uses: ./.github/actions/setup-windows
        with: { groups: user packages }
      - run: just install
      - run: just test-user
      - run: just check-user
      - run: just build-user-release
      - run: just verify-user-artifact
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign standalone App
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\src\app\build\bin\go-mapi.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Select MSIX identity
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $signature = Get-AuthenticodeSignature src/app/build/bin/go-mapi.exe
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) { throw 'App signature is not trusted and timestamped' }
          $stable = '${{ inputs.track }}' -eq 'stable'
          if ($stable) {
            foreach ($name in @('STORE_IDENTITY_NAME','STORE_PUBLISHER','STORE_PUBLISHER_DISPLAY_NAME','GOMAPI_STORE_PACKAGE_FAMILY_NAME')) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing Store identity: $name" }
            }
          }
          "PACKAGE_IDENTITY_NAME=$(if ($stable) { $env:STORE_IDENTITY_NAME } else { 'com.marcfargas.gomapi.validation' })" | Add-Content $env:GITHUB_ENV
          "PACKAGE_PUBLISHER=$(if ($stable) { $env:STORE_PUBLISHER } else { $signature.SignerCertificate.Subject })" | Add-Content $env:GITHUB_ENV
          "PACKAGE_PUBLISHER_DISPLAY_NAME=$(if ($stable) { $env:STORE_PUBLISHER_DISPLAY_NAME } else { 'go-mapi development' })" | Add-Content $env:GITHUB_ENV
      - uses: ./.github/actions/package-user
        with:
          version: ${{ inputs.version }}
          app-exe: src/app/build/bin/go-mapi.exe
          app-manifest: src/app/build/bin/app-artifacts.json
          identity-name: ${{ env.PACKAGE_IDENTITY_NAME }}
          publisher: ${{ env.PACKAGE_PUBLISHER }}
          publisher-display-name: ${{ env.PACKAGE_PUBLISHER_DISPLAY_NAME }}
          require-signature: 'true'
      - name: Sign App containers
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\release\app\go-mapi-${{ inputs.version }}-x64.msix
            ${{ github.workspace }}\release\app\go-mapi-user-${{ inputs.version }}-x64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify final packages and record signatures
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          just verify-user-distribution -Version $env:VERSION -MsixPath "release/app/go-mapi-$env:VERSION-x64.msix" -InstallerPath "release/app/go-mapi-user-$env:VERSION-x64.exe" -AppExePath src/app/build/bin/go-mapi.exe -RequireSignature
          if ($LASTEXITCODE -ne 0) { throw 'App distribution verification failed' }
          $signatures = foreach ($path in @('src/app/build/bin/go-mapi.exe',"release/app/go-mapi-$env:VERSION-x64.msix","release/app/go-mapi-user-$env:VERSION-x64.exe")) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid' -or $signature.SignatureType -ne 'Authenticode' -or -not $signature.SignerCertificate -or -not $signature.TimeStamperCertificate) { throw "Invalid timestamped signature: $path" }
            [ordered]@{ file=[IO.Path]::GetFileName($path); sha256=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant(); status='Valid'; signerSubject=$signature.SignerCertificate.Subject; signerThumbprint=$signature.SignerCertificate.Thumbprint; timestampThumbprint=$signature.TimeStamperCertificate.Thumbprint }
          }
          $proof = [ordered]@{ schema='go-mapi-app-release-signatures-v1'; repository='${{ github.repository }}'; commit='${{ github.sha }}'; sourceRef='${{ github.ref }}'; runId='${{ github.run_id }}'; runAttempt='${{ github.run_attempt }}'; version=$env:VERSION; signatures=@($signatures); validationTrust='windows-default'; testTrust=$null; azure=[ordered]@{ endpoint='https://weu.codesigning.azure.net/'; account='lachispa'; certificateProfile='lachispa' } }
          [IO.File]::WriteAllText('release/app/signatures.json', ($proof | ConvertTo-Json -Depth 6), [Text.UTF8Encoding]::new($false))
          Copy-Item src/app/build/bin/app-artifacts.json release/app/standalone-app-artifacts.json
          $installer = "release/app/go-mapi-user-$env:VERSION-x64.exe"
          $url = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/go-mapi-user-$env:VERSION-x64.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          foreach ($template in Get-ChildItem distribution/winget/*.yaml.in) {
            $text = (Get-Content $template.FullName -Raw).Replace('@@VERSION@@',$env:VERSION).Replace('@@INSTALLER_URL@@',$url).Replace('@@INSTALLER_SHA256@@',$hash)
            [IO.File]::WriteAllText((Join-Path release/app ([IO.Path]::GetFileNameWithoutExtension($template.Name))), $text, [Text.UTF8Encoding]::new($false))
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-app
          path: release/app/
          if-no-files-found: error
