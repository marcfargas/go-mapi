# Installer Smoke Test workflow — Phase 3 / INST-07 / 03-04-PLAN
#
# Builds the interceptor DLL, the Go native host, and the Inno Setup
# installer from scratch, then runs the Pester 5 smoke test at
# src/installer/tests/installer.Tests.ps1 which exercises a full silent
# install -> verify registry + files -> silent uninstall -> verify removed
# cycle on the windows-latest runner.
#
# The whole pipeline runs inline inside one job (no dependency on build.yml
# or release.yml) so a PR touching only the installer files runs the full
# round-trip in one workflow. Runs on push/PR to main or develop when any
# installer, interceptor, native-host, or workflow file changes, plus on
# manual workflow_dispatch.

name: Installer Smoke Test

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/installer/**'
      - 'src/interceptor/**'
      - 'src/native-host/**'
      - '.github/workflows/installer-smoke.yml'
  pull_request:
    paths:
      - 'src/installer/**'
      - 'src/interceptor/**'
      - 'src/native-host/**'
      - '.github/workflows/installer-smoke.yml'
  workflow_dispatch: {}

concurrency:
  group: installer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build + install + uninstall round-trip
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW, Ninja, CMake, Inno Setup
        run: |
          choco install mingw ninja cmake innosetup --no-progress -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $env:GITHUB_PATH

      - name: Build interceptor DLL
        working-directory: src/interceptor
        run: .\build.ps1 -Config Release -Clean

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build native host
        working-directory: src/native-host
        shell: pwsh
        run: |
          go mod tidy
          go build -ldflags "-s -w -X main.Version=0.0.0-smoke" -o build/go-mapi-host.exe .

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" `
            /DGOMAPIVersion=0.0.0-smoke `
            src\installer\go-mapi.iss
          if (-not (Test-Path 'src\installer\dist\go-mapi-setup.exe')) {
            throw 'Installer compile produced no go-mapi-setup.exe'
          }

      - name: Install / verify Pester 5
        shell: pwsh
        run: |
          # windows-latest ships Pester 5 by default; this step is a
          # belt-and-braces no-op that forces the correct version if a future
          # runner image ever ships Pester 4.
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Get-Module -Name Pester -ListAvailable | Select-Object -First 1 Name, Version, Path

      - name: Run installer smoke test
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0.0 -Force
          $config = New-PesterConfiguration
          $config.Run.Path = 'src/installer/tests/installer.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'installer-smoke-results.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $config

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke-results
          path: installer-smoke-results.xml
          if-no-files-found: warn

      - name: Upload smoke-built installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-mapi-setup-smoke
          path: src/installer/dist/go-mapi-setup.exe
          if-no-files-found: warn
