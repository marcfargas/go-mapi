name: Installer smoke test

# Per-PR + develop/main push smoke gate (D-29). Compiles installer end-to-end
# on windows-latest and round-trips install+uninstall via Pester 5. Blocks
# merges on failure. Path-filtered so doc-only PRs skip the ~3-minute job.
#
# No code signing here (release-only per D-25); dev ldflags only. See
# installer-release.yml (plan 10-06) for the signed-release pipeline.

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/installer/**'
      - 'src/interceptor/**'
      - 'src/app/**'
      - '.github/workflows/installer-smoke.yml'
  pull_request:
    paths:
      - 'src/installer/**'
      - 'src/interceptor/**'
      - 'src/app/**'
      - '.github/workflows/installer-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    name: Build installer + Pester round-trip
    runs-on: windows-latest
    permissions:
      contents: read

    # WR-03: intentionally NO OAuth secret env vars here. Pester never launches
    # go-mapi.exe (D-22 excludes live-UI tests) — only the installer + uninstaller
    # round-trip is exercised. Injecting real OAuth secrets via ldflags would
    # embed the client_secret in the string table of go-mapi.exe, which then
    # gets bundled into go-mapi-setup.exe and uploaded as a workflow artifact
    # (retention-days: 7). Artifacts on public repos are read-by-anyone; the
    # release workflow (installer-release.yml) is the only intentional path
    # for publishing a binary that contains the injected secrets.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install mingw-mstorsjo-llvm-ucrt (interceptor build toolchain)
        shell: pwsh
        run: |
          # build.ps1 (since QUICK-260423-ntu) requires the triple-prefixed clang driver
          # from scoop's mingw-mstorsjo-llvm-ucrt package — choco's mingw uses a different
          # driver layout and is unusable for our x64 + x86 dual build. The package also
          # bundles cmake + ninja, so no separate cmake/ninja install is needed here.
          Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned -Force
          # windows-latest pwsh sessions run elevated (as runneradmin); scoop's installer
          # aborts under elevation unless SCOOP_INSTALL_AS_ADMIN=1 is set (or -RunAsAdmin
          # is passed). Setting the env var is a no-op when non-elevated and clears the
          # gate when elevated, so it's safe in both modes.
          $env:SCOOP_INSTALL_AS_ADMIN = "1"
          Invoke-WebRequest -UseBasicParsing https://get.scoop.sh -OutFile "$env:TEMP\install-scoop.ps1"
          & "$env:TEMP\install-scoop.ps1"
          scoop install mingw-mstorsjo-llvm-ucrt
          if ($LASTEXITCODE -ne 0) { throw "scoop install mingw-mstorsjo-llvm-ucrt failed (exit $LASTEXITCODE)" }
          # Sanity check — fail fast if either triple-prefixed driver is missing.
          # build.ps1 reads from this exact path; it is hardcoded, not PATH-derived.
          $bin = "$env:USERPROFILE\scoop\apps\mingw-mstorsjo-llvm-ucrt\current\bin"
          foreach ($exe in @('x86_64-w64-mingw32-clang.exe','i686-w64-mingw32-clang.exe')) {
            if (-not (Test-Path "$bin\$exe")) { throw "Missing $exe in $bin" }
          }
          Write-Host "scoop mingw-mstorsjo-llvm-ucrt installed:"
          Get-ChildItem "$bin\*-w64-mingw32-clang*.exe" | ForEach-Object { Write-Host "  $($_.Name)" }
          # Persist scoop's shims dir on PATH for subsequent steps (GitHub Actions
          # only auto-propagates system PATH between steps; scoop appends to user
          # PATH, which a fresh pwsh session will not see without this echo).
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install npm workspace dependencies
        run: npm ci

      - name: Build frontend (Svelte 5 - produces src/app/frontend/dist for go:embed)
        run: npm run -w @marcfargas/go-mapi-app-frontend build

      - name: Build interceptor DLL
        run: npm run build:interceptor

      - name: Build Wails app (dev ldflags - unsigned, AUMID only, no OAuth secrets)
        working-directory: src/app
        shell: pwsh
        # WR-03: OAuth ldflags intentionally omitted. The smoke harness only tests
        # installer install/uninstall — Pester never launches go-mapi.exe, so a
        # binary built without OAuth credentials installs and uninstalls correctly.
        # This keeps real OAuth secrets out of the workflow artifact (which is
        # broadly readable on public repos).
        run: |
          wails build -platform windows/amd64 -ldflags "-X main.aumidOverride=com.marcfargas.gomapi"

      - name: Install NSIS via scoop (extras bucket)
        shell: pwsh
        run: |
          scoop bucket add extras
          scoop install nsis
          if ($LASTEXITCODE -ne 0) { throw "scoop install nsis failed (exit $LASTEXITCODE)" }
          makensis /VERSION

      - name: Compile installer
        shell: pwsh
        # cwd matters: NSIS resolves ${__FILEDIR__} relative to the script
        # invocation path; running makensis from repo root double-resolves
        # the ..\..\LICENSE include. Match the local `npm run build:installer`
        # convention which cd's into src/installer first, then move the
        # artifact back to repo root for the existing downstream Test-Path
        # / artifact-upload steps.
        run: |
          Push-Location src/installer
          makensis /DGOMAPI_VERSION=0.0.0-smoke go-mapi.nsi
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "makensis failed (exit $LASTEXITCODE)" }
          Pop-Location
          Move-Item src/installer/go-mapi-setup.exe go-mapi-setup.exe -Force

      - name: Confirm installer artifact produced
        shell: pwsh
        run: |
          if (-not (Test-Path 'go-mapi-setup.exe')) {
            throw "go-mapi-setup.exe not produced by makensis"
          }
          $size = (Get-Item 'go-mapi-setup.exe').Length
          Write-Host "go-mapi-setup.exe size: $size bytes"

      - name: Run Pester smoke tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path         = 'src/installer/tests/installer.Tests.ps1'
          $config.Run.Exit         = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Upload installer as workflow artifact (for debugging failed runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-mapi-setup-smoke-${{ github.sha }}
          path: go-mapi-setup.exe
          if-no-files-found: warn
          retention-days: 7
