name: Go Nightly Race Detector

# GOTEST-03: Dedicated nightly job that runs `go test -race ./...` on
# windows-latest with CGO_ENABLED=1. Kept separate from build.yml so the
# per-PR Go test job stays fast — the race detector roughly doubles
# execution time and is not needed on every push. The watcher race
# (FOUND-01 in Phase 1) was fixed before this workflow was turned on.

on:
  schedule:
    # 03:00 UTC daily — low-traffic window, well after EU working hours.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  go-race:
    name: Go test -race (windows-latest)
    runs-on: windows-latest
    env:
      CGO_ENABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: go test -race ./...
        working-directory: src/native-host
        run: go test -race -v ./...
