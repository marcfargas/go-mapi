name: Build signed machine packages

on:
  workflow_call:
    inputs:
      version: { type: string, required: true }
      system_tag: { type: string, default: '' }
      system_manifest_sha256: { type: string, default: '' }

permissions:
  contents: read
  id-token: write

jobs:
  build-sign-verify:
    runs-on: windows-latest
    timeout-minutes: 45
    environment: artifact-signing
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      SYSTEM_TAG: ${{ inputs.system_tag }}
      SYSTEM_MANIFEST_SHA256: ${{ inputs.system_manifest_sha256 }}
      GOMAPI_OAUTH_CLIENT_ID: ${{ secrets.GOMAPI_OAUTH_CLIENT_ID }}
      GOMAPI_OAUTH_CLIENT_SECRET: ${{ secrets.GOMAPI_OAUTH_CLIENT_SECRET }}
      GOMAPI_ADMIN_RELEASE_METADATA_URL: ${{ vars.ADMIN_RELEASE_METADATA_URL }}
      MACHINE_RELEASE_METADATA_ORIGIN: https://go-mapi.app
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: extractions/setup-just@v2
      - name: Require production signing inputs
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          if ($env:ACT) { throw 'Production signing and MSI extraction require hosted infrastructure' }
          if ($env:SIGNING_ENDPOINT -cne 'https://weu.codesigning.azure.net/' -or $env:SIGNING_ACCOUNT -cne 'lachispa' -or $env:SIGNING_PROFILE -cne 'lachispa') { throw 'Production signing profile required' }
          foreach ($name in @('GOMAPI_OAUTH_CLIENT_ID','GOMAPI_OAUTH_CLIENT_SECRET','GOMAPI_ADMIN_RELEASE_METADATA_URL')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing protected release input: $name" }
          }
          New-Item -ItemType Directory -Force release/machine-input,release/machine | Out-Null
      - uses: ./.github/actions/setup-windows
        with: { groups: native user }
      - name: Import pinned published System
        if: inputs.system_tag != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $oldRelease = $env:SYSTEM_TAG -replace '^(system-)?v',''
          $oldTrack = go run ./internal/mapi/cmd/release-track -- $oldRelease
          if ($LASTEXITCODE -ne 0) { throw 'Invalid reused System release track' }
          $newTrack = go run ./internal/mapi/cmd/release-track -- $env:VERSION
          if ($LASTEXITCODE -ne 0 -or ($oldTrack | Where-Object { $_ -like 'track=*' }) -cne ($newTrack | Where-Object { $_ -like 'track=*' })) { throw 'Reused System must share the release track; build a new System when crossing tracks' }
          $msiName = "go-mapi-system-$oldRelease-x64.msi"
          $published = gh api "repos/${{ github.repository }}/releases/tags/$env:SYSTEM_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.draft -or $published.tag_name -cne $env:SYSTEM_TAG) { throw 'Selected System is not a published release' }
          New-Item -ItemType Directory -Force reuse-input | Out-Null
          gh release download $env:SYSTEM_TAG --repo '${{ github.repository }}' --dir reuse-input --pattern release.json --pattern $msiName
          if ($LASTEXITCODE -ne 0) { throw 'Published System bundle is incomplete' }
          $manifestPath = Join-Path reuse-input release.json
          if ((Get-FileHash $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:SYSTEM_MANIFEST_SHA256) { throw 'Pinned release manifest hash differs' }
          $release = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $old = $release.system
          $msiPath = Join-Path reuse-input $msiName
          if ($release.schema -cne 'go-mapi-release-v1' -or $release.repository -cne '${{ github.repository }}' -or
              $release.version -cne $oldRelease -or $release.tag -cne $env:SYSTEM_TAG -or $release.tag -cne "v$oldRelease" -or $release.commit -cnotmatch '^[a-f0-9]{40}$' -or
              $release.runId -cnotmatch '^[1-9][0-9]*$' -or $release.runAttempt -cnotmatch '^[1-9][0-9]*$' -or
              $old.reused -isnot [bool] -or $old.reused -or $null -ne $old.manifestSha256 -or $old.version -cne $release.version -or $old.tag -cne $release.tag -or
              $old.commit -cne $release.commit -or $old.runId -cne $release.runId -or $old.runAttempt -cne $release.runAttempt -or
              $release.signing.validationTrust -cne 'windows-default' -or
              $old.derivative.kind -cne 'production' -or $old.derivative.metadataOrigin -cne 'https://go-mapi.app' -or
              $old.derivative.artifactOrigin -cne 'https://github.com/marcfargas/go-mapi/releases/download/' -or
              $old.derivative.checkIntervalSeconds -ne 21600 -or $old.derivative.PSObject.Properties['timers'] -or
              $release.signing.azure.certificateProfile -cne 'lachispa' -or $release.signing.azure.account -cne 'lachispa' -or $release.signing.azure.endpoint -cne 'https://weu.codesigning.azure.net/' -or
              $old.artifact.file -cne $msiName -or $old.artifact.sha256 -cne (Get-FileHash $msiPath -Algorithm SHA256).Hash.ToLowerInvariant() -or
              $old.artifact.size -ne (Get-Item $msiPath).Length) { throw 'Published System provenance mismatch' }
          git fetch --no-tags origin "refs/tags/$env:SYSTEM_TAG"
          if ($LASTEXITCODE -ne 0 -or (git rev-parse 'FETCH_HEAD^{commit}').Trim() -cne $old.commit) { throw 'Published System tag/source mismatch' }
          git merge-base --is-ancestor $old.commit HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Reused System source is not an ancestor of this release' }
          $paths = @('src/service','src/interceptor','internal/mapi','src/installer/msi','components.json','go.work','go.work.sum','.github/actions/setup-windows','.github/workflows/admin-release.yml','.github/workflows/release.yml',':(exclude)**/*_test.go',':(exclude)src/installer/msi/tests',':(exclude)src/interceptor/tests')
          git diff --exit-code $old.commit HEAD -- @paths
          if ($LASTEXITCODE -ne 0) { throw 'System source, machine installation or build inputs changed; build a new System' }
          $identity = go run ./internal/mapi/cmd/machine-package -- system $oldRelease | ConvertFrom-Json
          $systemContract = (Get-Content components.json -Raw | ConvertFrom-Json).machinePackages.system
          if ($LASTEXITCODE -ne 0 -or $identity.productCode -cne $old.productCode -or $identity.productVersion -cne $old.productVersion -or $identity.sequence -ne $old.sequence -or $systemContract.upgradeCode -cne $old.upgradeCode) { throw 'Published System package identity mismatch' }
          $newIdentity = go run ./internal/mapi/cmd/machine-package -- suite $env:VERSION | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $newIdentity.sequence -le $identity.sequence) { throw 'Release must follow the reused System version' }
          ./src/installer/msi/verify.ps1 -MsiPath $msiPath -SKU system -PackageRelease $oldRelease -RequireSignature
          if ($LASTEXITCODE -ne 0) { throw 'Published System MSI verification failed' }
          $sig = Get-AuthenticodeSignature $msiPath
          if ($sig.Status -ne 'Valid' -or $sig.SignatureType -ne 'Authenticode' -or -not $sig.TimeStamperCertificate) { throw 'Published System signature is not trusted and timestamped' }
          $extract = Join-Path $env:RUNNER_TEMP ('system-import-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory $extract | Out-Null
          try {
            $process = Start-Process msiexec.exe -ArgumentList @('/a',('"' + [IO.Path]::GetFullPath($msiPath) + '"'),'/qn',('TARGETDIR="' + $extract + '"')) -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw 'Published System extraction failed' }
            if (@($old.components).Count -ne 2 -or (@($old.components.component | Sort-Object) -join ',') -cne 'interceptor,service') { throw 'Published System component set differs' }
            foreach ($part in $old.components) {
              $expectedArchitectures = if ($part.component -eq 'service') { 'x64' } else { 'x64,x86' }
              if ((@($part.artifacts.architecture | Sort-Object) -join ',') -cne $expectedArchitectures -or $part.version -cne $oldRelease) { throw 'Published System architecture/version differs' }
              if ($part.source.commit -cne $old.commit -or $part.source.buildId -cne "$($old.runId).$($old.runAttempt):$($part.component)") { throw 'Published System component source missing' }
              foreach ($artifact in $part.artifacts) {
                $name = if ($part.component -eq 'service') { 'go-mapi-service.exe' } else { "go-mapi-$($artifact.architecture).dll" }
                $suffix = if ($part.component -eq 'service') { 'go-mapi\service\go-mapi-service.exe' } else { "go-mapi\interceptor\$(if ($artifact.architecture -eq 'x64') { 'AMD64' } else { 'x86' })\go-mapi.dll" }
                $files = @(Get-ChildItem $extract -Recurse -File | Where-Object { $_.FullName.EndsWith($suffix,[StringComparison]::OrdinalIgnoreCase) })
                if ($artifact.filename -cne $name -or $files.Count -ne 1 -or $artifact.sha256 -cnotmatch '^[a-f0-9]{64}$' -or $artifact.unsignedSha256 -cnotmatch '^[a-f0-9]{64}$' -or (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $artifact.sha256) { throw "Published System payload differs: $name" }
                $sig = Get-AuthenticodeSignature $files[0].FullName
                if ($sig.Status -ne 'Valid' -or $sig.SignatureType -ne 'Authenticode' -or -not $sig.TimeStamperCertificate -or (Get-Item $files[0].FullName).VersionInfo.ProductVersion -cne $part.version) { throw "Published System PE trust/version mismatch: $name" }
                Copy-Item $files[0].FullName (Join-Path release/machine-input $name)
              }
            }
            $service = @($old.components | Where-Object component -eq 'service')[0]
            $interceptor = @($old.components | Where-Object component -eq 'interceptor')[0]
            [IO.File]::WriteAllText('release/machine-input/prior-system.json', ($old | ConvertTo-Json -Depth 12), [Text.UTF8Encoding]::new($false))
            "SERVICE_VERSION=$($service.version)" | Add-Content $env:GITHUB_ENV
            "INTERCEPTOR_VERSION=$($interceptor.version)" | Add-Content $env:GITHUB_ENV
          } finally { Remove-Item -LiteralPath $extract -Recurse -Force }
      - name: Build new System payload once
        if: inputs.system_tag == ''
        shell: pwsh
        run: |
          foreach ($path in @('src/service/VERSION','src/interceptor/interceptor-version.txt')) {
            if ((Get-Content $path -Raw).Trim() -cne $env:VERSION) { throw "New System source version differs: $path" }
          }
          go test ./internal/mapi/... ./src/service/...
          if ($LASTEXITCODE -ne 0) { throw 'Machine checks failed' }
          ./src/interceptor/verify-release.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Interceptor release checks failed' }
          ./src/service/build.ps1 -OutputPath release/machine-input/go-mapi-service.exe -RequireMachineReleaseTrust
          if ($LASTEXITCODE -ne 0) { throw 'Service release build failed' }
          Copy-Item release/interceptor/go-mapi-x86.dll,release/interceptor/go-mapi-x64.dll release/machine-input/
          "SERVICE_VERSION=$env:VERSION" | Add-Content $env:GITHUB_ENV
          "INTERCEPTOR_VERSION=$env:VERSION" | Add-Content $env:GITHUB_ENV
      - name: Build distinct machine App
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'App dependencies failed' }
          just build-user-machine
          if ($LASTEXITCODE -ne 0) { throw 'Machine App build failed' }
          just verify-user-artifact -Distribution machine -ArtifactPath src/app/build/bin/go-mapi-machine.exe
          if ($LASTEXITCODE -ne 0) { throw 'Machine App source verification failed' }
          Copy-Item src/app/build/bin/go-mapi-machine.exe release/machine-input/
          Copy-Item src/app/build/bin/app-artifacts.json release/machine-input/machine-app-artifacts.json
          $hashes = [ordered]@{}
          if ($env:SYSTEM_TAG) {
            $prior = Get-Content release/machine-input/prior-system.json -Raw | ConvertFrom-Json
            foreach ($record in $prior.components.artifacts) { $hashes[$record.filename] = $record.unsignedSha256 }
          }
          foreach ($file in Get-ChildItem release/machine-input -File | Where-Object Extension -in @('.exe','.dll')) {
            if (-not $hashes.Contains($file.Name)) { $hashes[$file.Name] = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          [IO.File]::WriteAllText('release/machine-input/unsigned-hashes.json', ($hashes | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign new System payload once
        if: inputs.system_tag == ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\release\machine-input\go-mapi-service.exe
            ${{ github.workspace }}\release\machine-input\go-mapi-x86.dll
            ${{ github.workspace }}\release\machine-input\go-mapi-x64.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Sign machine App
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\release\machine-input\go-mapi-machine.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Package Suite and optional System from identical signed inputs
        shell: pwsh
        run: |
          $unsigned = Get-Content release/machine-input/unsigned-hashes.json -Raw | ConvertFrom-Json
          $skus = if ($env:SYSTEM_TAG) { @('suite') } else { @('system','suite') }
          foreach ($sku in $skus) {
            $manifest = "release/machine-input/$sku-input.json"
            $app = if ($sku -eq 'suite') { @{ AppVersion=$env:VERSION; AppBuildManifest='release/machine-input/machine-app-artifacts.json'; UnsignedAppSha256=$unsigned.'go-mapi-machine.exe' } } else { @{} }
            ./src/installer/msi/write-signed-input.ps1 -SKU $sku -PackageRelease $env:VERSION -SourceCommit '${{ github.sha }}' -InputDirectory release/machine-input -ServiceVersion $env:SERVICE_VERSION -InterceptorVersion $env:INTERCEPTOR_VERSION @app -RequireSignature -OutputPath $manifest
            ./src/installer/msi/build.ps1 -SKU $sku -SignedInputManifest $manifest -RequireSignedInputs
            if ($LASTEXITCODE -ne 0) { throw "$sku MSI build failed" }
            ./src/installer/msi/verify.ps1 -SKU $sku -MsiPath "release/machine/go-mapi-$sku-$env:VERSION-x64.msi" -PackageRelease $env:VERSION
            if ($LASTEXITCODE -ne 0) { throw "$sku MSI table verification failed" }
          }
      - name: Sign final machine MSIs
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\release\machine
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify exact payloads and retain build evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unsigned = Get-Content release/machine-input/unsigned-hashes.json -Raw | ConvertFrom-Json
          $prior = if ($env:SYSTEM_TAG) { Get-Content release/machine-input/prior-system.json -Raw | ConvertFrom-Json } else { $null }
          $selection = [ordered]@{ version=if ($prior) { $prior.version } else { $env:VERSION }; tag=if ($prior) { $env:SYSTEM_TAG } else { "v$env:VERSION" }; commit=if ($prior) { $prior.commit } else { '${{ github.sha }}' }; reused=[bool]$prior; manifestSha256=if ($prior) { $env:SYSTEM_MANIFEST_SHA256 } else { $null } }
          if ($prior) { [IO.File]::WriteAllText('release/machine/reused-system.json', ($prior | ConvertTo-Json -Depth 12), [Text.UTF8Encoding]::new($false)) }
          Copy-Item release/machine-input/machine-app-artifacts.json release/machine/machine-app-artifacts.json
          $skus = if ($prior) { @('suite') } else { @('system','suite') }
          foreach ($sku in $skus) {
            $identity = go run ./internal/mapi/cmd/machine-package -- $sku $env:VERSION | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Machine identity failed' }
            $msi = Join-Path release/machine $identity.assetName
            ./src/installer/msi/verify.ps1 -SKU $sku -MsiPath $msi -PackageRelease $env:VERSION -RequireSignature
            if ($LASTEXITCODE -ne 0) { throw 'Signed machine MSI verification failed' }
            $manifestName = $identity.manifestName
            Copy-Item "release/machine-input/$sku-input.json" (Join-Path release/machine $manifestName)
            $manifest = Get-Content "release/machine-input/$sku-input.json" -Raw | ConvertFrom-Json
            $extract = Join-Path $env:RUNNER_TEMP ('release-extract-' + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory $extract | Out-Null
            $peHashes = @(); $signatures = @()
            try {
              $process = Start-Process msiexec.exe -ArgumentList @('/a',('"' + [IO.Path]::GetFullPath($msi) + '"'),'/qn',('TARGETDIR="' + $extract + '"')) -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw 'Final MSI extraction failed' }
              foreach ($part in $manifest.components) {
                foreach ($artifact in $part.artifacts) {
                  $suffix = switch ($part.component) { 'service' { 'go-mapi\service\go-mapi-service.exe' } 'app' { 'go-mapi\user\go-mapi.exe' } 'interceptor' { "go-mapi\interceptor\$(if ($artifact.architecture -eq 'x64') { 'AMD64' } else { 'x86' })\go-mapi.dll" } }
                  $files = @(Get-ChildItem $extract -Recurse -File | Where-Object { $_.FullName.EndsWith($suffix,[StringComparison]::OrdinalIgnoreCase) })
                  if ($files.Count -ne 1 -or (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $artifact.sha256) { throw "Final MSI signed payload differs: $($artifact.filename)" }
                  $peHashes += [ordered]@{ component=$part.component; architecture=$artifact.architecture; filename=$artifact.filename; unsignedSha256=$unsigned.($artifact.filename); signedSha256=$artifact.sha256 }
                }
              }
            } finally { Remove-Item -LiteralPath $extract -Recurse -Force }
            foreach ($path in @($manifest.components.artifacts | ForEach-Object { Join-Path release/machine-input $_.filename }) + @($msi)) {
              $sig = Get-AuthenticodeSignature $path
              if ($sig.Status -ne 'Valid' -or $sig.SignatureType -ne 'Authenticode' -or -not $sig.SignerCertificate -or -not $sig.TimeStamperCertificate) { throw "Invalid timestamped signature: $path" }
              $signatures += [ordered]@{ file=[IO.Path]::GetFileName($path); status='Valid'; signerSubject=$sig.SignerCertificate.Subject; signerThumbprint=$sig.SignerCertificate.Thumbprint; timestampThumbprint=$sig.TimeStamperCertificate.Thumbprint }
            }
            $service = @($manifest.components | Where-Object component -eq 'service')[0]
            $interceptor = @($manifest.components | Where-Object component -eq 'interceptor')[0]
            $sources = if ($prior) {
              $priorService = @($prior.components | Where-Object component -eq 'service')[0]
              $priorInterceptor = @($prior.components | Where-Object component -eq 'interceptor')[0]
              [ordered]@{ service=[ordered]@{ commit=$priorService.source.commit; buildId=$priorService.source.buildId; signedSha256=$priorService.artifacts[0].sha256 }; interceptor=[ordered]@{ commit=$priorInterceptor.source.commit; buildId=$priorInterceptor.source.buildId; x86SignedSha256=@($priorInterceptor.artifacts | Where-Object architecture -eq 'x86')[0].sha256; x64SignedSha256=@($priorInterceptor.artifacts | Where-Object architecture -eq 'x64')[0].sha256 } }
            } else {
              [ordered]@{ service=[ordered]@{ commit='${{ github.sha }}'; buildId='${{ github.run_id }}.${{ github.run_attempt }}:service'; signedSha256=$service.artifacts[0].sha256 }; interceptor=[ordered]@{ commit='${{ github.sha }}'; buildId='${{ github.run_id }}.${{ github.run_attempt }}:interceptor'; x86SignedSha256=@($interceptor.artifacts | Where-Object architecture -eq 'x86')[0].sha256; x64SignedSha256=@($interceptor.artifacts | Where-Object architecture -eq 'x64')[0].sha256 } }
            }
            if ($sku -eq 'suite') { $sources.app = [ordered]@{ commit='${{ github.sha }}'; buildId=(Get-FileHash release/machine/machine-app-artifacts.json -Algorithm SHA256).Hash.ToLowerInvariant(); signedSha256=@($manifest.components | Where-Object component -eq 'app')[0].artifacts[0].sha256 } }
            $issued = [DateTimeOffset]::UtcNow
            $spec = [ordered]@{ sku=$sku; packageRelease=$env:VERSION; contained=@($manifest.components | ForEach-Object { [ordered]@{ component=$_.component; version=$_.version } }); compatibility=@($manifest.components | ForEach-Object { [ordered]@{ component=$_.component; minInclusive="$([int]$_.version.Split('.')[0]).0.0-0"; maxExclusive="$([int]$_.version.Split('.')[0] + 1).0.0" } }); issuedAt=$issued.ToString('yyyy-MM-ddTHH:mm:ssZ'); expiresAt=$issued.AddDays(30).ToString('yyyy-MM-ddTHH:mm:ssZ') }
            if ($sku -eq 'system') { $spec.requires = (Get-Content components.json -Raw | ConvertFrom-Json).components.interceptor.requires }
            $specPath = Join-Path $env:RUNNER_TEMP "$sku-spec.json"
            [IO.File]::WriteAllText($specPath, ($spec | ConvertTo-Json -Depth 8), [Text.UTF8Encoding]::new($false))
            $targetName = "$sku-targets.json"
            go run ./internal/mapi/cmd/machine-targets --spec $specPath --msi $msi --out (Join-Path release/machine $targetName)
            if ($LASTEXITCODE -ne 0) { throw 'Final machine target generation failed' }
            $target = Get-Content (Join-Path release/machine $targetName) -Raw | ConvertFrom-Json
            $proof = [ordered]@{
              schema='go-mapi-machine-validation-provenance-v1'; publishable=$true; repository='${{ github.repository }}'; commit='${{ github.sha }}'; sourceRef='${{ github.ref }}'; tag="v$env:VERSION"; runId='${{ github.run_id }}'; runAttempt='${{ github.run_attempt }}'
              sku=$sku; packageRelease=$env:VERSION; assetName=$identity.assetName; productCode=$identity.productCode; productVersion=$identity.productVersion; upgradeCode=(Get-Content components.json -Raw | ConvertFrom-Json).machinePackages.$sku.upgradeCode; sequence=$identity.sequence
              contained=$spec.contained; componentSources=$sources; systemPackage=$selection; peHashes=$peHashes; signatures=$signatures; testTrust=$null; validationTrust='windows-default'
              azure=[ordered]@{ endpoint='https://weu.codesigning.azure.net/'; account='lachispa'; certificateProfile='lachispa' }
              derivative=[ordered]@{ kind='production'; metadataOrigin='https://go-mapi.app'; artifactOrigin='https://github.com/marcfargas/go-mapi/releases/download/'; checkIntervalSeconds=21600 }
              signedInputManifest=[ordered]@{ file=$manifestName; sha256=(Get-FileHash (Join-Path release/machine $manifestName) -Algorithm SHA256).Hash.ToLowerInvariant() }
              appBuildManifest=if ($sku -eq 'suite') { [ordered]@{ file='machine-app-artifacts.json'; sha256=(Get-FileHash release/machine/machine-app-artifacts.json -Algorithm SHA256).Hash.ToLowerInvariant() } } else { $null }
              msi=[ordered]@{ signed=$true; size=(Get-Item $msi).Length; sha256=(Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant() }
              targets=[ordered]@{ file=$targetName; sha256=(Get-FileHash (Join-Path release/machine $targetName) -Algorithm SHA256).Hash.ToLowerInvariant(); sequence=$target.sequence; artifactUrl=$target.artifact.url }
            }
            [IO.File]::WriteAllText("release/machine/$sku-$env:VERSION.validation.json", ($proof | ConvertTo-Json -Depth 12), [Text.UTF8Encoding]::new($false))
          }
          [IO.File]::WriteAllText('release/machine/system-selection.json', ($selection | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: release-machine
          path: |
            release/machine/go-mapi-*.msi
            release/machine/go-mapi-*.manifest.json
            release/machine/*-targets.json
            release/machine/*.validation.json
            release/machine/machine-app-artifacts.json
            release/machine/system-selection.json
            release/machine/reused-system.json
          if-no-files-found: error
