name: User App

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Non-development app version to build and verify'
        required: true
        type: string

jobs:
  app:
    runs-on: windows-latest
    env:
      CGO_ENABLED: '1'
      GOMAPI_OAUTH_CLIENT_ID: ci-client
      GOMAPI_OAUTH_CLIENT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert clean app-only checkout
        shell: pwsh
        run: |
          $absent = @('src/app/frontend/dist','src/app/build/bin','src/interceptor/build-x86','src/interceptor/build-x64','src/installer')
          foreach ($path in $absent) { if (($path -ne 'src/installer') -and (Test-Path $path)) { throw "unexpected output: $path" } }
      - run: npm ci
      - name: Assert npm did not build components
        shell: pwsh
        run: |
          if (Test-Path src/app/frontend/dist) { throw 'frontend must be built by the scoped command' }
          if ((Test-Path src/interceptor/build-x86) -or (Test-Path src/interceptor/build-x64)) { throw 'interceptor output is forbidden' }
      - run: npm run test:app
      - run: npm run check:app
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: npm run build:app
      - name: Reassert app-only outputs
        shell: pwsh
        run: |
          if (-not (Test-Path src/app/frontend/dist)) { throw 'scoped command did not build frontend' }
          if ((Test-Path src/interceptor/build-x86) -or (Test-Path src/interceptor/build-x64)) { throw 'interceptor output is forbidden' }
          if (-not (Test-Path src/app/build/bin/go-mapi.exe)) { throw 'app artifact missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: go-mapi-app
          path: src/app/build/bin/go-mapi.exe

  app-release-artifact:
    # A release artifact is opt-in and has a distinct, explicit version input.
    # The generic app job above deliberately remains a development build.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      CGO_ENABLED: '1'
      GOMAPI_OAUTH_CLIENT_ID: ci-client
      GOMAPI_OAUTH_CLIENT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Set explicit component release version
        shell: pwsh
        run: |
          $version = '${{ inputs.app_version }}'.Trim()
          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq '0.0.0-dev') { throw 'app_version must be a release version' }
          $versionFile = Join-Path $env:GITHUB_WORKSPACE 'src/app/VERSION'
          [System.IO.File]::WriteAllText($versionFile, $version + [Environment]::NewLine)
      - run: npm ci
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build guarded app release artifact
        run: npm run build:app:release
      - name: Verify guarded app release artifact
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-app-artifact.ps1 -ArtifactPath src/app/build/bin/go-mapi.exe
      - uses: actions/upload-artifact@v4
        with:
          name: go-mapi-app-release-${{ inputs.app_version }}
          path: src/app/build/bin/go-mapi.exe
