name: Legacy combined-installer validation

# The v3 combined installer is deliberately not a distribution channel. The
# split release contracts are app-v* (per-user app) and admin-v* (machine-wide
# interceptor). Retain this small, manual check only to catch accidental
# reintroduction of a combined release path.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-split-release-boundary:
    name: Validate split release boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Assert only component contracts can publish
        run: go test ./internal/mapi -run 'Test(OnlySplitReleaseContractsCanPublish|LegacyReleaseWorkflowsAreValidationOnly)$'
