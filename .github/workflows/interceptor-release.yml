name: Legacy interceptor validation

# The interceptor is published only by admin-release.yml on admin-v* tags,
# together with its signed MSI and signed metadata. A bare-DLL release is not
# a valid admin installation contract. This manual workflow is retained as a
# build verifier and may not create releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify both interceptor architectures
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW clang toolchain
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned -Force
          $env:SCOOP_INSTALL_AS_ADMIN = '1'
          Invoke-WebRequest -UseBasicParsing https://get.scoop.sh -OutFile "$env:TEMP\install-scoop.ps1"
          & "$env:TEMP\install-scoop.ps1"
          scoop install mingw-mstorsjo-llvm-ucrt
          if ($LASTEXITCODE -ne 0) { throw 'toolchain installation failed' }
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Verify and stage both interceptor architectures
        shell: pwsh
        run: .\src\interceptor\verify-release.ps1

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interceptor-verification-${{ github.sha }}
          path: release/interceptor/
          retention-days: 7
