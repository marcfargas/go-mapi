name: E2E Tests

# E2E-01: Playwright end-to-end tests for Phase 4.
#
# Runs on windows-latest only — Chrome extensions + native messaging are
# Windows-specific in this project. Builds the native host, the
# extension, and the two Go mock servers (mock-gmail + mock-host) before
# handing off to Playwright with launchPersistentContext.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install npm dependencies
        run: npm ci

      - name: Install MinGW and Ninja (for interceptor + test harness)
        run: |
          choco install mingw ninja cmake --no-progress -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $env:GITHUB_PATH

      - name: Build interceptor and test harness
        working-directory: src/interceptor
        run: .\build.ps1 -Config Release -Tests -Clean

      - name: Build native host
        working-directory: src/native-host
        run: go build -ldflags "-s -w -X main.Version=2.0.0" -o build/go-mapi-host.exe .

      - name: Build extension
        run: npm run build:extension

      - name: Build mock Gmail server
        working-directory: tests/e2e/mock-gmail
        run: go build -o mock-gmail.exe .

      - name: Build mock native host
        working-directory: tests/e2e/mock-host
        run: go build -o mock-host.exe .

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npx playwright test --config tests/e2e/playwright.config.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
