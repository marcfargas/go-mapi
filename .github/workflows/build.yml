name: Build and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_call:

jobs:
  build-interceptor:
    name: Build Interceptor (C++)
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW and Ninja
        run: |
          choco install mingw ninja cmake --no-progress -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $env:GITHUB_PATH

      - name: Build Interceptor and Test Harness
        working-directory: src/interceptor
        run: .\build.ps1 -Config ${{ matrix.config }} -Tests -Clean

      - name: Run Test Harness
        working-directory: src/interceptor
        run: .\build\bin\go-mapi-test-harness.exe .\build\bin\go-mapi.dll
        continue-on-error: true

      - name: Run C++ Unit Tests (doctest via ctest)
        working-directory: src/interceptor/build
        run: ctest --output-on-failure --build-config ${{ matrix.config }}

      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-mapi-dll-${{ matrix.config }}
          path: src/interceptor/build/bin/go-mapi.dll
          if-no-files-found: warn

      - name: Upload Test Harness Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-mapi-tests-${{ matrix.config }}
          path: src/interceptor/build/bin/go-mapi-test-harness.exe
          if-no-files-found: warn

  build-native-host:
    name: Build Native Host (Go)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run Go Tests
        working-directory: src/native-host
        run: go test -v ./...

      - name: Build Native Messaging Host
        working-directory: src/native-host
        run: |
          go mod tidy
          go build -ldflags "-s -w" -o build/go-mapi-host.exe .

      - name: Upload Native Host Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-mapi-native-host
          path: src/native-host/build/go-mapi-host.exe
          if-no-files-found: warn

  build-extension:
    name: Build Extension (React)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run -w go-mapi-extension typecheck

      - name: Run Extension Tests
        run: npm run -w go-mapi-extension test:run

      - name: Build Extension
        run: npm run build:extension

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-mapi-extension
          path: src/extension/dist/
          if-no-files-found: warn
