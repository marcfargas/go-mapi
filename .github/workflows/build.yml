name: Build

# The sole CI producer. App and interceptor work run independently; the
# package job joins their tested payloads to produce the signing input.
on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'internal/**'
      - 'package*.json'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'internal/**'
      - 'package*.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version embedded in the unsigned test build'
        required: true
        default: '0.0.0-signing-test'
        type: string
      channel:
        description: 'Intended distribution channel; this workflow never releases'
        required: true
        default: 'test'
        type: choice
        options: [test, beta, nightly]

permissions:
  contents: read

jobs:
  app:
    name: Build and test app
    runs-on: windows-2025
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Install npm workspace dependencies
        run: npm ci
      - name: Build frontend
        run: npm run -w @marcfargas/go-mapi-app-frontend build
      - name: Test Go
        shell: bash
        run: |
          go vet ./internal/mapi/... ./src/app/...
          go test -race -coverprofile=coverage-internal-mapi.out -v ./internal/mapi/...
          go test -race -coverprofile=coverage-src-app.out -v ./src/app/...
      - name: Test frontend
        run: |
          npm run -w @marcfargas/go-mapi-app-frontend check
          npm run -w @marcfargas/go-mapi-app-frontend test:run
      - name: Build Wails app
        working-directory: src/app
        shell: pwsh
        run: |
          $version = '${{ inputs.version || '0.0.0-dev' }}'
          wails build -platform windows/amd64 -ldflags "-X main.Version=$version -X main.aumidOverride=com.marcfargas.gomapi"
      - name: Upload app payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-mapi-app-payload
          path: src/app/build/bin/go-mapi.exe
          if-no-files-found: error
          retention-days: 1

  interceptor:
    name: Build and test interceptor
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native build tools
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned -Force
          $env:SCOOP_INSTALL_AS_ADMIN = '1'
          Invoke-WebRequest -UseBasicParsing https://get.scoop.sh -OutFile "$env:TEMP\install-scoop.ps1"
          & "$env:TEMP\install-scoop.ps1"
          scoop install mingw-mstorsjo-llvm-ucrt
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build and test interceptor
        shell: pwsh
        run: |
          npm run build:interceptor
          npm run build:interceptor:debug
          src/interceptor/build-x64/bin/go-mapi-test-harness.exe src/interceptor/build-x64/bin/go-mapi.dll
          ctest --test-dir src/interceptor/build-x64 --output-on-failure --build-config Debug
      - name: Stage interceptor payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force interceptor-payload/x64, interceptor-payload/x86 | Out-Null
          Copy-Item src/interceptor/build-x64/bin/go-mapi.dll interceptor-payload/x64/
          Copy-Item src/interceptor/build-x86/bin/go-mapi.dll interceptor-payload/x86/
      - name: Upload interceptor payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-mapi-interceptor-payload
          path: interceptor-payload/
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package and test installer
    needs: [app, interceptor]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-mapi-app-payload
          path: payload/app
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-mapi-interceptor-payload
          path: payload/interceptor
      - name: Build installer
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          New-Item -ItemType Directory -Force src/app/build/bin, src/interceptor/build-x64/bin, src/interceptor/build-x86/bin | Out-Null
          Copy-Item payload/app/go-mapi.exe src/app/build/bin/
          Copy-Item payload/interceptor/x64/go-mapi.dll src/interceptor/build-x64/bin/
          Copy-Item payload/interceptor/x86/go-mapi.dll src/interceptor/build-x86/bin/
          Push-Location src/installer
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /DGOMAPI_VERSION=${{ inputs.version || '0.0.0-dev' }} go-mapi.nsi
          Pop-Location
          Move-Item src/installer/go-mapi-setup.exe go-mapi-setup.exe -Force
      - name: Test installer round-trip
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'src/installer/tests/installer.Tests.ps1'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config
      - name: Stage unsigned signing input
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force go-mapi-windows-unsigned/unsigned | Out-Null
          Copy-Item go-mapi-setup.exe go-mapi-windows-unsigned/
          Copy-Item src/app/build/bin/go-mapi.exe go-mapi-windows-unsigned/unsigned/
          Copy-Item src/interceptor/build-x64/bin/go-mapi.dll go-mapi-windows-unsigned/unsigned/go-mapi-x64.dll
          Copy-Item src/interceptor/build-x86/bin/go-mapi.dll go-mapi-windows-unsigned/unsigned/go-mapi-x86.dll
          Set-Content go-mapi-windows-unsigned/version.txt '${{ inputs.version || '0.0.0-dev' }}' -NoNewline
      - name: Upload unsigned signing input
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-mapi-windows-unsigned
          path: go-mapi-windows-unsigned/
          if-no-files-found: error
          retention-days: 7
