name: Build and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_call:

jobs:
  build-interceptor:
    name: Build Interceptor (C++)
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-mstorsjo-llvm-ucrt (triple-prefixed clang + bundled cmake/ninja)
        shell: pwsh
        run: |
          # build.ps1 (since QUICK-260423-ntu) requires the triple-prefixed clang driver
          # from scoop's mingw-mstorsjo-llvm-ucrt package — choco's mingw uses a different
          # driver layout and is unusable for our x64 + x86 dual build. The package also
          # bundles cmake + ninja, so no separate cmake/ninja install is needed here.
          Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned -Force
          # windows-latest pwsh sessions run elevated (as runneradmin); scoop's installer
          # aborts under elevation unless SCOOP_INSTALL_AS_ADMIN=1 is set (or -RunAsAdmin
          # is passed). Setting the env var is a no-op when non-elevated and clears the
          # gate when elevated, so it's safe in both modes.
          $env:SCOOP_INSTALL_AS_ADMIN = "1"
          Invoke-WebRequest -UseBasicParsing https://get.scoop.sh -OutFile "$env:TEMP\install-scoop.ps1"
          & "$env:TEMP\install-scoop.ps1"
          scoop install mingw-mstorsjo-llvm-ucrt
          if ($LASTEXITCODE -ne 0) { throw "scoop install mingw-mstorsjo-llvm-ucrt failed (exit $LASTEXITCODE)" }
          # Sanity check — fail fast if either triple-prefixed driver is missing.
          # build.ps1 reads from this exact path; it is hardcoded, not PATH-derived.
          $bin = "$env:USERPROFILE\scoop\apps\mingw-mstorsjo-llvm-ucrt\current\bin"
          foreach ($exe in @('x86_64-w64-mingw32-clang.exe','i686-w64-mingw32-clang.exe')) {
            if (-not (Test-Path "$bin\$exe")) { throw "Missing $exe in $bin" }
          }
          Write-Host "scoop mingw-mstorsjo-llvm-ucrt installed:"
          Get-ChildItem "$bin\*-w64-mingw32-clang*.exe" | ForEach-Object { Write-Host "  $($_.Name)" }
          # Persist scoop's shims dir on PATH for subsequent steps (GitHub Actions
          # only auto-propagates system PATH between steps; scoop appends to user
          # PATH, which a fresh pwsh session will not see without this echo).
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build Interceptor and Test Harness
        working-directory: src/interceptor
        run: .\build.ps1 -Config ${{ matrix.config }} -Tests -Clean

      - name: Run Test Harness
        working-directory: src/interceptor
        run: .\build-x64\bin\go-mapi-test-harness.exe .\build-x64\bin\go-mapi.dll
        continue-on-error: true

      - name: Run C++ Unit Tests (doctest via ctest)
        working-directory: src/interceptor/build-x64
        run: ctest --output-on-failure --build-config ${{ matrix.config }}

      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-mapi-dll-${{ matrix.config }}
          path: src/interceptor/build-x64/bin/go-mapi.dll
          if-no-files-found: warn

      - name: Upload Test Harness Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-mapi-tests-${{ matrix.config }}
          path: src/interceptor/build-x64/bin/go-mapi-test-harness.exe
          if-no-files-found: warn

  build-wails-app:
    name: Build Wails App (Go + Svelte)
    runs-on: windows-latest
    env:
      CGO_ENABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # CRITICAL: npm ci + frontend build MUST run before any 'go test' or
      # 'go vet' on ./src/app/... because src/app/main.go has
      # //go:embed all:frontend/dist. On a clean checkout, src/app/frontend/dist/
      # does not exist yet — it's produced here.
      - name: Install npm workspace dependencies
        run: npm ci

      - name: Build frontend (produces src/app/frontend/dist for go:embed)
        run: npm run -w @marcfargas/go-mapi-app-frontend build

      - name: go vet
        run: go vet ./internal/mapi/... ./src/app/...

      - name: go test -race with coverage (internal/mapi)
        # shell: bash — pwsh mis-splits `-coverprofile=x.out` at the `.`, passing `.out` as a package arg
        shell: bash
        run: go test -race -coverprofile=coverage-internal-mapi.out -v ./internal/mapi/...

      - name: go test -race with coverage (src/app)
        shell: bash
        run: go test -race -coverprofile=coverage-src-app.out -v ./src/app/...

      - name: Upload Go coverage (internal/mapi)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-internal-mapi
          path: coverage-internal-mapi.out
          if-no-files-found: warn

      - name: Upload Go coverage (src/app)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-src-app
          path: coverage-src-app.out
          if-no-files-found: warn

      - name: svelte-check (blocking)
        run: npm run -w @marcfargas/go-mapi-app-frontend check

      - name: Vitest frontend tests (blocking)
        run: npm run -w @marcfargas/go-mapi-app-frontend test:run

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: wails build (sanity)
        working-directory: src/app
        run: wails build -platform windows/amd64

      - name: Upload Wails app artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-mapi-wails-app
          path: src/app/build/bin/
          if-no-files-found: warn
