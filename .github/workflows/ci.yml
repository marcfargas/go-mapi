name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_call:
    inputs:
      run_race:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_race:
        description: 'Run the Windows Go race detector in addition to ordinary CI'
        required: false
        type: boolean
        default: false

  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

# Superseded PR runs have no release authority. Keep every integration push
# available: release workflows require successful push CI for their exact SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-check:
    if: github.event_name != 'schedule'
    name: Windows development checks
    runs-on: windows-latest
    env:
      CGO_ENABLED: '1'
      GOMAPI_OAUTH_CLIENT_ID: ci-client
      GOMAPI_OAUTH_CLIENT_SECRET: ci-secret
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: ${{ !env.ACT }}
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        if: ${{ !env.ACT }}
        with: { node-version: 20 }
      - uses: extractions/setup-just@v2
        if: ${{ !env.ACT }}
      - run: just install
      - run: just check-windows

  user-component:
    if: ${{ github.event_name != 'schedule' }}
    name: User component (cross-platform)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
      GOMAPI_OAUTH_CLIENT_ID: ci-client
      GOMAPI_OAUTH_CLIENT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: extractions/setup-just@v2
      - run: just install
      - run: npx playwright install --with-deps chromium
      - run: just check-portable
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: go-mapi-playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  app-packages:
    if: ${{ github.event_name != 'schedule' }}
    name: App artifact (${{ matrix.role }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: standalone
            version: source
            recipe: build-user-release
            distribution: standalone
            image: go-mapi.exe
            output: ci-input/app-standalone
            artifact: go-mapi-standalone-app
          - role: appA
            version: baseline
            recipe: build-user-machine
            distribution: machine
            image: go-mapi-machine.exe
            output: ci-input/appA
            artifact: go-mapi-machine-app
          - role: appC
            version: appUpgrade
            recipe: build-user-machine
            distribution: machine
            image: go-mapi-machine.exe
            output: ci-input/appC
            artifact: go-mapi-machine-app-suiteC
    env:
      CGO_ENABLED: '1'
      GOMAPI_OAUTH_CLIENT_ID: ci-client
      GOMAPI_OAUTH_CLIENT_SECRET: ci-secret
      GOMAPI_ADMIN_RELEASE_METADATA_URL: https://go-mapi.app
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: ${{ !env.ACT }}
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        if: ${{ !env.ACT }}
        with: { node-version: 20 }
      - uses: extractions/setup-just@v2
        if: ${{ !env.ACT }}
      - uses: ./.github/actions/setup-windows
        with:
          groups: user packages
          install: ${{ !env.ACT }}
      - name: Resolve the selected app version
        id: version
        env:
          APP_VERSION_ROLE: ${{ matrix.version }}
        run: |
          if ($env:APP_VERSION_ROLE -eq 'source') {
            $version = (Get-Content src/app/VERSION -Raw).Trim()
          } else {
            $spec = Get-Content src/installer/msi/tests/fixtures/machine.json -Raw | ConvertFrom-Json
            if ($spec.schema -cne 'go-mapi-machine-fixture-spec-v1') { throw 'Unknown fixture specification' }
            $version = [string]$spec.versions.($env:APP_VERSION_ROLE)
            if (-not $version) { throw 'Missing fixture version role' }
            Set-Content src/app/VERSION $version -NoNewline -Encoding ascii
            Set-Content src/interceptor/interceptor-version.txt $spec.versions.baseline -NoNewline -Encoding ascii
          }
          if (-not $version) { throw 'Missing app version' }
          "version=$version" | Add-Content $env:GITHUB_OUTPUT
      - run: just install
      - name: Build and verify the selected app
        run: |
          just '${{ matrix.recipe }}' -OutputDirectory '${{ matrix.output }}'
          if ($LASTEXITCODE -ne 0) { throw 'App build failed' }
          just verify-user-artifact -Distribution '${{ matrix.distribution }}' -ArtifactPath '${{ matrix.output }}/${{ matrix.image }}'
          if ($LASTEXITCODE -ne 0) { throw 'App artifact verification failed' }
      - name: Build unsigned user packages
        if: matrix.role == 'standalone'
        uses: ./.github/actions/package-user
        with:
          version: ${{ steps.version.outputs.version }}
          app-exe: ci-input/app-standalone/go-mapi.exe
          app-manifest: ci-input/app-standalone/app-artifacts.json
          identity-name: com.marcfargas.gomapi.validation
          publisher: CN=go-mapi validation
          publisher-display-name: go-mapi validation
          output-directory: release/app
          require-signature: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && matrix.role == 'standalone'
        with:
          name: go-mapi-user-package-validation-${{ github.run_id }}
          path: release/app/
          if-no-files-found: warn
          retention-days: 7

  # Service fixture compilation needs source and the fixture specification only.
  # Provision LLVM and build all three versions alongside app/native producers,
  # before the signing/MSI job joins their immutable artifacts.
  admin-service-fixtures:
    if: ${{ github.event_name != 'schedule' }}
    name: Build machine service test fixtures
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: ${{ !env.ACT }}
        with: { go-version: '1.25' }
      - uses: extractions/setup-just@v2
        if: ${{ !env.ACT }}
      - uses: ./.github/actions/setup-windows
        with:
          groups: native
          install: ${{ !env.ACT }}
      - name: Build unsigned service versions
        shell: pwsh
        run: |
          just test-machine-service-inputs
          if ($LASTEXITCODE -ne 0) { throw 'Service fixture admission checks failed' }
          just build-machine-test-services -FixtureSpecification src/installer/msi/tests/fixtures/machine.json -OutputDirectory ci-input/services -MetadataOrigin https://localhost:18453 -ArtifactOrigin https://localhost:18453/releases/download/ -ValidationTimers
          if ($LASTEXITCODE -ne 0) { throw 'Service fixture build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: go-mapi-machine-service-inputs
          path: ci-input/services/
          if-no-files-found: error
          retention-days: 7

  user-windows-shell:
    if: ${{ github.event_name != 'schedule' }}
    name: User component Windows shell
    runs-on: windows-latest
    needs: [build-interceptor]
    env:
      CGO_ENABLED: '1'
      GOMAPI_OAUTH_CLIENT_ID: ci-client
      GOMAPI_OAUTH_CLIENT_SECRET: ci-secret
      GOMAPI_ADMIN_RELEASE_METADATA_URL: https://go-mapi.app
    steps:
      - name: Require a disposable runner for machine changes
        shell: pwsh
        run: |
          if ($env:ACT) { throw 'This job changes Windows state. Use the Just Sandbox commands for local execution.' }
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: extractions/setup-just@v2
      - name: Select native integration fixture versions
        shell: pwsh
        run: |
          $spec = Get-Content src/installer/msi/tests/fixtures/machine.json -Raw | ConvertFrom-Json
          Set-Content src/app/VERSION $spec.versions.baseline -NoNewline -Encoding ascii
          Set-Content src/interceptor/interceptor-version.txt $spec.versions.baseline -NoNewline -Encoding ascii
      - run: just install
      - uses: ./.github/actions/setup-windows
        with: { groups: user }
      - run: just build-frontend
      - run: just test-service
      - uses: actions/download-artifact@v4
        with:
          pattern: go-mapi-*-Release
          path: ci-input/interceptor
          merge-multiple: false
      - name: Run actual x86/x64 interceptor to app queue integration
        shell: pwsh
        run: |
          just e2e-system-windows `
            -X64Dll ci-input/interceptor/go-mapi-dll-x64-Release/go-mapi.dll `
            -X64Harness ci-input/interceptor/go-mapi-tests-x64-Release/go-mapi-test-harness.exe `
            -X86Dll ci-input/interceptor/go-mapi-dll-x86-Release/go-mapi.dll `
            -X86Harness ci-input/interceptor/go-mapi-tests-x86-Release/go-mapi-test-harness.exe `
            -InterceptorVersion (Get-Content src/interceptor/interceptor-version.txt -Raw).Trim() `
            -AppVersion (Get-Content src/app/VERSION -Raw).Trim() `
            -EvidenceDirectory "test-results/245-ci/${{ github.run_id }}/component"
          if ($LASTEXITCODE -ne 0) { throw 'component queue integration failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-mapi-component-integration-${{ github.run_id }}
          path: test-results/245-ci/${{ github.run_id }}/component/
          if-no-files-found: warn
          retention-days: 7

  build-interceptor:
    if: ${{ github.event_name != 'schedule' }}
    name: Build interceptor (${{ matrix.arch }}, ${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      # Keep all architecture/configuration results visible when one leg fails.
      # This avoids masking a second bitness regression behind a cancellation.
      fail-fast: false
      matrix:
        config: [Debug, Release]
        arch: [x64, x86]
    steps:
      - name: Require a disposable runner for machine changes
        shell: pwsh
        run: |
          if ($env:ACT) { throw 'This job changes Windows state. Use the Just Sandbox commands for local execution.' }
      - uses: actions/checkout@v4
      - name: Select native fixture version
        shell: pwsh
        run: |
          $spec = Get-Content src/installer/msi/tests/fixtures/machine.json -Raw | ConvertFrom-Json
          Set-Content src/interceptor/interceptor-version.txt $spec.versions.baseline -NoNewline -Encoding ascii
      - uses: extractions/setup-just@v2
      - uses: ./.github/actions/setup-windows
        with: { groups: native }
      - name: Build interceptor, run harness and CTest
        run: just test-system ${{ matrix.arch }} ${{ matrix.config }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: go-mapi-ctest-failure-${{ matrix.arch }}-${{ matrix.config }}-${{ github.run_id }}
          path: src/interceptor/build-${{ matrix.arch }}/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: go-mapi-dll-${{ matrix.arch }}-${{ matrix.config }}
          path: src/interceptor/build-${{ matrix.arch }}/bin/go-mapi.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: go-mapi-tests-${{ matrix.arch }}-${{ matrix.config }}
          path: src/interceptor/build-${{ matrix.arch }}/bin/go-mapi-test-harness.exe
          if-no-files-found: error

  # The machine scenarios share the machine-global service, MSI product,
  # certificate stores and fixture port 18453, so each runs alone on its own
  # runner. The fixtures are built and signed once here and reused by every
  # scenario job; admin-msi below is the aggregate gate.
  admin-msi-fixtures:
    if: ${{ github.event_name != 'schedule' }}
    name: Build machine MSI test fixtures
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [build-interceptor, app-packages, admin-service-fixtures]
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Require a disposable runner for machine changes
        shell: pwsh
        run: |
          if ($env:ACT) { throw 'This job changes Windows state. Use the Just Sandbox commands for local execution.' }
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: extractions/setup-just@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: go-mapi-dll-*-Release
          path: ci-input/interceptor
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: go-mapi-machine-app
          path: ci-input/appA
      - uses: actions/download-artifact@v4
        with:
          name: go-mapi-machine-app-suiteC
          path: ci-input/appC
      - uses: actions/download-artifact@v4
        with:
          name: go-mapi-machine-service-inputs
          path: ci-input/services
      - name: Build selected machine fixture packages
        shell: pwsh
        run: |
          $spec = Get-Content src/installer/msi/tests/fixtures/machine.json -Raw | ConvertFrom-Json
          Set-Content src/app/VERSION $spec.versions.baseline -NoNewline -Encoding ascii
          Set-Content src/interceptor/interceptor-version.txt $spec.versions.baseline -NoNewline -Encoding ascii
          just build-machine-test-packages -FixtureSpecification src/installer/msi/tests/fixtures/machine.json -ServiceBuildManifest ci-input/services/service-builds.json -X64Dll ci-input/interceptor/go-mapi-dll-x64-Release/go-mapi.dll -X86Dll ci-input/interceptor/go-mapi-dll-x86-Release/go-mapi.dll -MachineApp ci-input/appA/go-mapi-machine.exe -AppBuildManifest ci-input/appA/app-artifacts.json -SuiteCApp ci-input/appC/go-mapi-machine.exe -SuiteCAppBuildManifest ci-input/appC/app-artifacts.json -OutputDirectory release/machine-test -EvidenceDirectory 'test-results/245-ci/${{ github.run_id }}/build' -MetadataOrigin https://localhost:18453 -ArtifactOrigin https://localhost:18453/releases/download/ -ValidationTimers
          if ($LASTEXITCODE -ne 0) { throw 'Machine fixture build failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-mapi-machine-fixtures-${{ github.run_id }}
          path: |
            test-results/245-ci/${{ github.run_id }}/build/
            release/machine-test/
          if-no-files-found: warn
          retention-days: 7

  admin-msi-scenario:
    if: ${{ github.event_name != 'schedule' }}
    name: Machine MSI scenario (${{ matrix.scenario }})
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [admin-msi-fixtures]
    strategy:
      # Every scenario result stays visible when one fails.
      fail-fast: false
      matrix:
        scenario: [cross-sku, update, suite-update, update-interruption, readiness-recovery, suite-readiness-recovery]
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Require a disposable runner for machine changes
        shell: pwsh
        run: |
          if ($env:ACT) { throw 'This job changes Windows state. Use the Just Sandbox commands for local execution.' }
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: extractions/setup-just@v2
      - uses: actions/download-artifact@v4
        with:
          name: go-mapi-machine-fixtures-${{ github.run_id }}
          path: .
      - name: Admit the exact downloaded fixture signer
        shell: pwsh
        run: |
          $manifest = Get-Content 'test-results/245-ci/${{ github.run_id }}/build/machine-test-packages.json' -Raw | ConvertFrom-Json
          $path = [string]$manifest.fixture.signerPublicCertificate
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($path)
          try {
            if ($certificate.Thumbprint -cne [string]$manifest.fixture.signerThumbprint -or
                $certificate.NotBefore.ToUniversalTime() -gt [DateTime]::UtcNow -or $certificate.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow) { throw 'Fixture certificate identity or validity differs' }
            foreach ($store in @('Root','TrustedPublisher')) { Import-Certificate -FilePath $path -CertStoreLocation "Cert:\LocalMachine\$store" | Out-Null }
          } finally { $certificate.Dispose() }
      - name: Exercise hosted machine scenario ${{ matrix.scenario }}
        shell: pwsh
        run: |
          $runRoot = "test-results/245-ci/${{ github.run_id }}"
          just machine-hosted-integration -PackageManifest (Join-Path $runRoot 'build/machine-test-packages.json') -EvidenceDirectory $runRoot -FixturePort 18453 -Scenario ${{ matrix.scenario }}
          if ($LASTEXITCODE -ne 0) { throw 'hosted machine integration failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-mapi-machine-native-validation-${{ matrix.scenario }}-${{ github.run_id }}
          path: test-results/245-ci/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 7

  # Aggregate gate. It keeps the job name that branch protection and
  # docs/component-integration-gate.md refer to. Independent Windows checks
  # still gate success without delaying fixture construction and scenarios.
  admin-msi:
    if: ${{ always() && github.event_name != 'schedule' }}
    name: Validate machine MSI lifecycle and installed updater
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [windows-check, user-windows-shell, admin-service-fixtures, admin-msi-fixtures, admin-msi-scenario]
    steps:
      - name: Require Windows checks, integration, fixtures and every scenario to pass
        shell: bash
        run: |
          for result in '${{ needs.windows-check.result }}' '${{ needs.user-windows-shell.result }}' '${{ needs.admin-service-fixtures.result }}' '${{ needs.admin-msi-fixtures.result }}' '${{ needs.admin-msi-scenario.result }}'; do
            if [ "$result" != "success" ]; then
              echo "Windows checks, integration or machine MSI validation did not pass: $result" >&2
              exit 1
            fi
          done

  go-race:
    if: ${{ github.event_name == 'schedule' || inputs.run_race }}
    name: Go test -race (windows-latest)
    runs-on: windows-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Require a disposable runner for machine changes
        shell: pwsh
        run: |
          if ($env:ACT) { throw 'This job changes Windows state. Use the Just Sandbox commands for local execution.' }
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: extractions/setup-just@v2
      - run: just install
      - run: just build-frontend
      - run: just test-windows-race
