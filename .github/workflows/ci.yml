name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      run_race:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_race:
        description: 'Run the Windows Go race detector in addition to ordinary CI'
        required: false
        type: boolean
        default: false

  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  user-component:
    if: github.event_name != 'schedule'
    name: User component (cross-platform)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
      GOMAPI_OAUTH_CLIENT_ID: ci-client
      GOMAPI_OAUTH_CLIENT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: extractions/setup-just@v2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: just check-portable
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: go-mapi-playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  user-windows-shell:
    if: github.event_name != 'schedule'
    name: User component Windows shell
    runs-on: windows-latest
    needs: build-interceptor
    env:
      CGO_ENABLED: '1'
      GOMAPI_OAUTH_CLIENT_ID: ci-client
      GOMAPI_OAUTH_CLIENT_SECRET: ci-secret
      GOMAPI_ADMIN_RELEASE_METADATA_URL: https://github.com/marcfargas/go-mapi/releases/latest/download/admin-targets.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: extractions/setup-just@v2
      - name: Set explicit native validation component versions
        shell: pwsh
        run: |
          Set-Content src/app/VERSION -Value 5.0.1-alpha.4 -NoNewline -Encoding ascii
          Set-Content src/interceptor/interceptor-version.txt -Value 5.0.1-alpha.4 -NoNewline -Encoding ascii
      - run: npm ci
      - run: just prepare-windows -Wails -Packages -Install
      - run: just test-windows
      - run: pwsh -NoProfile -File scripts/tests/BuildCi.Tests.ps1
      - name: Build and verify release standalone app once for both user packages
        shell: pwsh
        run: |
          just build-user-release -OutputDirectory ci-input/app-standalone
          if ($LASTEXITCODE -ne 0) { throw 'standalone app build failed' }
          just verify-user-artifact -ArtifactPath ci-input/app-standalone/go-mapi.exe
          if ($LASTEXITCODE -ne 0) { throw 'standalone app verification failed' }
          if (-not (Test-Path src/app/frontend/dist)) { throw 'Wails did not build frontend' }
          if ((Test-Path src/interceptor/build-x86) -or (Test-Path src/interceptor/build-x64)) { throw 'app command built interceptor unexpectedly' }
      - name: Package and verify the same odd-major standalone bytes
        shell: pwsh
        run: |
          just package-user-msix -Version 5.0.1-alpha.4 -IdentityName com.marcfargas.gomapi.validation -Publisher 'CN=go-mapi validation' -PublisherDisplayName 'go-mapi validation' -AppExe ci-input/app-standalone/go-mapi.exe
          if ($LASTEXITCODE -ne 0) { throw 'user MSIX failed' }
          just package-user-standalone -Version 5.0.1-alpha.4 -AppExe ci-input/app-standalone/go-mapi.exe
          if ($LASTEXITCODE -ne 0) { throw 'user standalone installer failed' }
          just verify-user-distribution -Version 5.0.1-alpha.4 -MsixPath release/app/go-mapi-5.0.1-alpha.4-x64.msix -InstallerPath release/app/go-mapi-user-5.0.1-alpha.4-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'user package verification failed' }
      - uses: actions/download-artifact@v4
        with:
          pattern: go-mapi-*-Release
          path: ci-input/interceptor
          merge-multiple: false
      - name: Run actual x86/x64 interceptor to app queue integration
        shell: pwsh
        run: |
          just e2e-system-windows `
            -X64Dll ci-input/interceptor/go-mapi-dll-x64-Release/go-mapi.dll `
            -X64Harness ci-input/interceptor/go-mapi-tests-x64-Release/go-mapi-test-harness.exe `
            -X86Dll ci-input/interceptor/go-mapi-dll-x86-Release/go-mapi.dll `
            -X86Harness ci-input/interceptor/go-mapi-tests-x86-Release/go-mapi-test-harness.exe `
            -InterceptorVersion (Get-Content src/interceptor/interceptor-version.txt -Raw).Trim() `
            -AppVersion (Get-Content src/app/VERSION -Raw).Trim() `
            -EvidenceDirectory "test-results/245-ci/${{ github.run_id }}/component"
          if ($LASTEXITCODE -ne 0) { throw 'component queue integration failed' }
      - name: Build and verify machine app A
        shell: pwsh
        run: |
          just build-user-machine -OutputDirectory ci-input/appA
          if ($LASTEXITCODE -ne 0) { throw 'machine app A build failed' }
          just verify-user-artifact -Distribution machine -ArtifactPath ci-input/appA/go-mapi-machine.exe
          if ($LASTEXITCODE -ne 0) { throw 'machine app A verification failed' }
      - name: Build and verify machine app C
        shell: pwsh
        run: |
          Set-Content src/app/VERSION -Value 5.0.2-alpha.1 -NoNewline -Encoding ascii
          just build-user-machine -OutputDirectory ci-input/appC
          if ($LASTEXITCODE -ne 0) { throw 'machine app C build failed' }
          just verify-user-artifact -Distribution machine -ArtifactPath ci-input/appC/go-mapi-machine.exe
          if ($LASTEXITCODE -ne 0) { throw 'machine app C verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: go-mapi-standalone-app
          path: ci-input/app-standalone/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: go-mapi-machine-app
          path: ci-input/appA/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: go-mapi-machine-app-suiteC
          path: ci-input/appC/
          if-no-files-found: error
      - name: Repeat real app builds and verify each retained pair
        shell: pwsh
        run: |
          Set-Content src/app/VERSION -Value 5.0.1-alpha.4 -NoNewline -Encoding ascii
          just build-user-release -OutputDirectory ci-input/app-standalone
          if ($LASTEXITCODE -ne 0) { throw 'repeated standalone build failed' }
          just verify-user-artifact -ArtifactPath ci-input/app-standalone/go-mapi.exe
          if ($LASTEXITCODE -ne 0) { throw 'repeated standalone verification failed' }
          just build-user-machine -OutputDirectory ci-input/appA
          if ($LASTEXITCODE -ne 0) { throw 'repeated machine A build failed' }
          just verify-user-artifact -Distribution machine -ArtifactPath ci-input/appA/go-mapi-machine.exe
          if ($LASTEXITCODE -ne 0) { throw 'repeated machine A verification failed' }
          Set-Content src/app/VERSION -Value 5.0.2-alpha.1 -NoNewline -Encoding ascii
          just build-user-machine -OutputDirectory ci-input/appC
          if ($LASTEXITCODE -ne 0) { throw 'repeated machine C build failed' }
          just verify-user-artifact -Distribution machine -ArtifactPath ci-input/appC/go-mapi-machine.exe
          if ($LASTEXITCODE -ne 0) { throw 'repeated machine C verification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-mapi-user-package-validation-${{ github.run_id }}
          path: release/app/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-mapi-component-integration-${{ github.run_id }}
          path: test-results/245-ci/${{ github.run_id }}/component/
          if-no-files-found: warn
          retention-days: 7

  build-interceptor:
    if: github.event_name != 'schedule'
    name: Build interceptor (${{ matrix.arch }}, ${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      # Keep all architecture/configuration results visible when one leg fails.
      # This avoids masking a second bitness regression behind a cancellation.
      fail-fast: false
      matrix:
        config: [Debug, Release]
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - name: Set explicit native validation interceptor version
        shell: pwsh
        run: Set-Content src/interceptor/interceptor-version.txt -Value 5.0.1-alpha.4 -NoNewline -Encoding ascii
      - uses: extractions/setup-just@v2
      - run: just prepare-windows -Native -Install
      - name: Build interceptor, run harness and CTest
        run: just test-system ${{ matrix.arch }} ${{ matrix.config }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: go-mapi-ctest-failure-${{ matrix.arch }}-${{ matrix.config }}-${{ github.run_id }}
          path: src/interceptor/build-${{ matrix.arch }}/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: go-mapi-dll-${{ matrix.arch }}-${{ matrix.config }}
          path: src/interceptor/build-${{ matrix.arch }}/bin/go-mapi.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: go-mapi-tests-${{ matrix.arch }}-${{ matrix.config }}
          path: src/interceptor/build-${{ matrix.arch }}/bin/go-mapi-test-harness.exe
          if-no-files-found: error

  admin-msi:
    if: github.event_name != 'schedule'
    name: Validate machine MSI lifecycle and installed updater
    runs-on: windows-latest
    timeout-minutes: 90
    needs: [build-interceptor, user-windows-shell]
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: extractions/setup-just@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: go-mapi-dll-*-Release
          path: ci-input/interceptor
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: go-mapi-machine-app
          path: ci-input/appA
      - uses: actions/download-artifact@v4
        with:
          name: go-mapi-machine-app-suiteC
          path: ci-input/appC
      - run: just prepare-windows -Native -Install
      - name: Prepare current system and suite MSI fixtures
        shell: pwsh
        run: |
          Set-Content src/app/VERSION -Value 5.0.1-alpha.4 -NoNewline -Encoding ascii
          Set-Content src/interceptor/interceptor-version.txt -Value 5.0.1-alpha.4 -NoNewline -Encoding ascii
          $evidence = "test-results/245-ci/${{ github.run_id }}/build"
          just build-machine-test-packages `
            -X64Dll ci-input/interceptor/go-mapi-dll-x64-Release/go-mapi.dll `
            -X86Dll ci-input/interceptor/go-mapi-dll-x86-Release/go-mapi.dll `
            -MachineApp ci-input/appA/go-mapi-machine.exe `
            -AppBuildManifest ci-input/appA/app-artifacts.json `
            -SuiteCApp ci-input/appC/go-mapi-machine.exe `
            -SuiteCAppBuildManifest ci-input/appC/app-artifacts.json `
            -OutputDirectory release/machine-test `
            -EvidenceDirectory $evidence `
            -MetadataOrigin https://localhost:18453 `
            -ArtifactOrigin https://localhost:18453/releases/download/
          if ($LASTEXITCODE -ne 0) { throw 'machine package preparation failed' }
          $manifest = Join-Path $evidence 'machine-test-packages.json'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw 'machine package manifest missing' }
      - name: Exercise fixed hosted machine lifecycle and update sequence
        shell: pwsh
        run: |
          $runRoot = "test-results/245-ci/${{ github.run_id }}"
          just machine-hosted-integration -PackageManifest (Join-Path $runRoot 'build/machine-test-packages.json') -EvidenceDirectory $runRoot -FixturePort 18453
          if ($LASTEXITCODE -ne 0) { throw 'hosted machine integration failed' }
      - name: Clean owned native fixtures after success or failure
        if: always()
        shell: pwsh
        run: |
          $runRoot = "test-results/245-ci/${{ github.run_id }}"
          $manifest = Join-Path $runRoot 'build/machine-test-packages.json'
          if (Test-Path -LiteralPath $manifest -PathType Leaf) {
            just machine-hosted-integration -PackageManifest $manifest -EvidenceDirectory $runRoot -FixturePort 18453 -CleanupOnly
            if ($LASTEXITCODE -ne 0) { throw 'hosted machine fallback cleanup failed' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-mapi-machine-native-validation-${{ github.run_id }}
          path: |
            test-results/245-ci/${{ github.run_id }}/
            release/machine-test/
          if-no-files-found: warn
          retention-days: 7

  go-race:
    if: github.event_name == 'schedule' || inputs.run_race
    name: Go test -race (windows-latest)
    runs-on: windows-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: extractions/setup-just@v2
      - run: npm ci
      - run: just build-frontend
      - run: go test -race -v ./internal/mapi/... ./src/app/... ./src/service/...
